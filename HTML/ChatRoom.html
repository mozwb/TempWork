<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6fb">
  <!-- 内联 SVG 图标：浏览器就不会再去要 /favicon.ico（那会是一条 404 日志） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236965e8'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='white'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  <title>小聊天室</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #24253a;
      background: #f5f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #9294a8;
      --line: #ececf3;
      --accent: #6965e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 12% 8%, #ecebff 0, transparent 34%),
        radial-gradient(ellipse at 92% 92%, #e8f4ff 0, transparent 30%),
        #f5f6fb;
    }

    button,
    textarea {
      font: inherit;
    }

    .chat-card {
      width: min(100%, 900px);
      height: min(760px, calc(100vh - 64px));
      min-height: 520px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 24px 70px rgba(49, 48, 96, 0.12);
    }

    .chat-header {
      min-height: 84px;
      padding: 18px 26px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--line);
    }

    .room-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 15px;
      color: white;
      background: linear-gradient(145deg, #817af5, #5d5be0);
      font-size: 22px;
    }

    .room-info {
      min-width: 0;
      flex: 1;
    }

    .room-info h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .room-info p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .preview-badge {
      padding: 7px 11px;
      border: 1px solid #eeeefe;
      border-radius: 999px;
      color: #6864cf;
      background: #f6f5ff;
      font-size: 11px;
      white-space: nowrap;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px clamp(18px, 5vw, 48px);
      scroll-behavior: smooth;
    }

    .date-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 2px 0 26px;
      color: #a4a5b5;
      font-size: 11px;
    }

    .date-divider::before,
    .date-divider::after {
      height: 1px;
      flex: 1;
      background: #f0f0f5;
      content: "";
    }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 18px 0;
    }

    .message.mine {
      justify-content: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      color: #5e5bb8;
      background: #eeedff;
      font-size: 13px;
      font-weight: 700;
    }

    .message-content {
      max-width: min(72%, 440px);
    }

    .message.mine .message-content {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .message-meta {
      margin: 0 0 6px 2px;
      color: #9a9bad;
      font-size: 11px;
    }

    .bubble {
      padding: 11px 15px;
      border: 1px solid #f0f0f5;
      border-radius: 5px 16px 16px;
      background: #f7f7fb;
      color: #424359;
      font-size: 14px;
      line-height: 1.65;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .mine .bubble {
      border-color: transparent;
      border-radius: 16px 5px 16px 16px;
      color: #fff;
      background: linear-gradient(135deg, #7771ed, #615fe0);
      box-shadow: 0 5px 12px rgba(105, 101, 232, 0.16);
    }

    .system-note {
      width: fit-content;
      max-width: 100%;
      margin: 26px auto 8px;
      padding: 8px 13px;
      border-radius: 10px;
      color: #85869a;
      background: #f7f7fa;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    .composer-wrap {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      padding: 10px 10px 10px 16px;
      border: 1px solid #e8e8f0;
      border-radius: 17px;
      background: #fbfbfd;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .composer:focus-within {
      border-color: #b9b6fb;
      box-shadow: 0 0 0 3px rgba(105, 101, 232, 0.09);
    }

    .composer textarea {
      width: 100%;
      min-height: 26px;
      max-height: 120px;
      resize: none;
      border: 0;
      outline: 0;
      color: #33344a;
      background: transparent;
      font-size: 14px;
      line-height: 1.6;
    }

    .composer textarea::placeholder {
      color: #aaabb9;
    }

    .send-button {
      min-width: 82px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      box-shadow: 0 4px 10px rgba(105, 101, 232, 0.2);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 150ms ease, transform 150ms ease;
    }

    .send-button:hover {
      background: #5955d5;
    }

    .send-button:active {
      transform: translateY(1px);
    }

    .send-button:focus-visible,
    .composer textarea:focus-visible {
      outline: 2px solid #8884f2;
      outline-offset: 3px;
    }

    .composer-hint {
      margin: 9px 3px 0;
      color: #a1a2b1;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
        background: #fff;
      }

      .chat-card {
        width: 100%;
        height: 100dvh;
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .chat-header {
        min-height: 76px;
        padding: 14px 18px;
      }

      .messages {
        padding: 20px 16px;
      }

      .composer-wrap {
        padding: 12px 14px max(14px, env(safe-area-inset-bottom));
      }

      .send-button {
        min-width: 70px;
      }
    }
    /* ── 起名：临时身份，不是注册 ── */
    .join-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(ellipse at 12% 8%, #ecebff 0, transparent 34%),
        radial-gradient(ellipse at 92% 92%, #e8f4ff 0, transparent 30%),
        #f5f6fb;
    }

    .join-layer.hidden {
      display: none;
    }

    .join-card {
      width: min(100%, 380px);
      padding: 30px 28px 26px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 24px 60px rgba(49, 48, 96, 0.12);
    }

    .join-card .room-icon {
      margin-bottom: 16px;
    }

    .join-card h1 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .join-card p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .join-error {
      margin: 10px 2px 0;
      min-height: 16px;
      color: #c0554f;
      font-size: 12px;
    }

    .join-card input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #e8e8f0;
      border-radius: 12px;
      outline: 0;
      color: #33344a;
      background: #fbfbfd;
      font-size: 15px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .join-card input:focus {
      border-color: #b9b6fb;
      box-shadow: 0 0 0 3px rgba(105, 101, 232, 0.09);
    }

    .join-card button {
      width: 100%;
      height: 44px;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      box-shadow: 0 4px 10px rgba(105, 101, 232, 0.2);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 150ms ease;
    }

    .join-card button:hover {
      background: #5955d5;
    }
  </style>
</head>
<body>
  <div class="join-layer" id="joinLayer">
    <form class="join-card" id="joinForm">
      <div class="room-icon" aria-hidden="true">✦</div>
      <h1>先起个名字</h1>
      <p>这只是临时身份，只存在当前标签页里 —— 关掉就没了，不用密码。</p>
      <input id="nameInput" maxlength="16" autocomplete="off" placeholder="比如：小幼仙" aria-label="昵称">
      <p class="join-error" id="joinError"></p>
      <button type="submit" id="joinButton">进入聊天室</button>
    </form>
  </div>

  <main class="chat-card" aria-label="聊天室">
    <header class="chat-header">
      <div class="room-icon" aria-hidden="true">✦</div>
      <div class="room-info">
        <h1>小聊天室</h1>
        <p>一个简单的聊天界面 · 你是 <span id="nameLabel">—</span></p>
      </div>
      <span class="preview-badge" id="connBadge">连接中…</span>
    </header>

    <section class="messages" id="messages" aria-label="聊天记录" aria-live="polite">
      <div class="date-divider"><span>今天</span></div>
    </section>

    <footer class="composer-wrap">
      <form class="composer" id="messageForm">
        <textarea id="messageInput" rows="1" aria-label="输入消息" placeholder="输入消息…"></textarea>
        <button class="send-button" type="submit" aria-label="发送消息">
          <span aria-hidden="true">➤</span>
          <span>发送</span>
        </button>
      </form>
      <p class="composer-hint">按 Enter 发送，Shift + Enter 换行</p>
    </footer>
  </main>

  <script>
    const form = document.querySelector("#messageForm");
    const input = document.querySelector("#messageInput");
    const messages = document.querySelector("#messages");

    // ── 临时身份：只活在这个标签页里 ──
    // sessionStorage 是「每个标签页一份」，所以两个窗口能起不同名字；
    // 用 localStorage 的话两个窗口会共用同一个名字。
    const joinLayer = document.querySelector("#joinLayer");
    const joinForm = document.querySelector("#joinForm");
    const nameInput = document.querySelector("#nameInput");
    const nameLabel = document.querySelector("#nameLabel");

    let myName = sessionStorage.getItem("chat.name") || "";

    function randomName() {
      return "游客" + Math.floor(1000 + Math.random() * 9000);
    }

    const joinError = document.querySelector("#joinError");

    async function joinRequest(name) {
      const response = await fetch("/join?name=" + encodeURIComponent(name), { method: "POST" });
      return response.json();
    }

    // 先在服务器上占名字：占不到就留在登录页换个名字
    async function enterChat(name) {
      try {
        let result = await joinRequest(name);

        // 刷新页面时的竞态：pagehide 里发的 /leave 可能还在路上，
        // 名字还没释放，这里就会误报"被占用"。等一下再试一次。
        if (!result.ok && result.reason === "taken") {
          await new Promise((resolve) => setTimeout(resolve, 400));
          result = await joinRequest(name);
        }

        if (!result.ok) {
          joinError.textContent =
            result.reason === "taken" ? "这个名字有人在用，换一个吧"
            : result.reason === "toolong" ? "名字最多 16 个字"
            : "名字不能为空";
          joinLayer.classList.remove("hidden");
          nameInput.focus();
          return false;
        }
      } catch {
        joinError.textContent = "连不上服务器";
        return false;
      }

      myName = name;
      sessionStorage.setItem("chat.name", name);
      nameLabel.textContent = name;
      joinError.textContent = "";
      joinLayer.classList.add("hidden");
      input.focus();
      poll(); // 立刻刷新人数，不用等下一轮
      return true;
    }

    if (myName) {
      // 上次的名字可能已经被别人占了，进不去就重新起
      enterChat(myName).then((ok) => {
        if (!ok) nameInput.value = randomName();
      });
    } else {
      nameInput.value = randomName();
      nameInput.focus();
    }

    joinForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = nameInput.value.trim().slice(0, 16);
      if (!name) {
        nameInput.focus();
        return;
      }
      await enterChat(name);
    });

    // 关页面时释放名字。崩溃/断网时发不出去 —— 那种情况只能下次换个名字。
    window.addEventListener("pagehide", () => {
      if (myName)
        navigator.sendBeacon("/leave?name=" + encodeURIComponent(myName));
    });

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 120)}px`;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }

      input.value = "";
      resizeInput();

      try {
        const response = await fetch("/send?name=" + encodeURIComponent(myName), {
          method: "POST",
          headers: { "Content-Type": "text/plain; charset=utf-8" },
          body: text
        });

        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          if (result.reason === "not_joined") {
            // 名字丢了（比如服务器重启过）：退回登录页
            joinError.textContent = "你已离线，重新起个名字";
            joinLayer.classList.remove("hidden");
            sessionStorage.removeItem("chat.name");
            nameInput.value = randomName();
            return;
          }
        }
      } catch {
        setConnected(false);
      }

      await poll(); // 立刻拉一次，不用等 1.5 秒
      input.focus();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });

    input.addEventListener("input", resizeInput);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    // ── 联机：每 1.5 秒问服务器要新消息 ──
    const badge = document.querySelector("#connBadge");
    let lastId = 0;

    function setConnected(ok) {
      badge.textContent = ok ? "已连接 · 自动刷新" : "连接断开，重试中…";
    }

    // 人数 = 当前被占用的名字数
    function setOnline(count) {
      badge.textContent = count + " 人在线";
    }

    function renderMessage(msg) {
      const article = document.createElement("article");
      article.className = msg.name === myName ? "message mine" : "message";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = [...msg.name][0] || "?";

      const content = document.createElement("div");
      content.className = "message-content";

      const meta = document.createElement("div");
      meta.className = "message-meta";
      meta.textContent = msg.name + " · " + msg.time;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = msg.text;   // textContent：不解析 HTML，防注入

      content.append(meta, bubble);
      article.append(avatar, content);
      return article;
    }

    async function poll() {
      try {
        // 名字也带上：只是为了让服务器日志能看出"谁在轮询"
        const who = "&name=" + encodeURIComponent(myName);
        const response = await fetch("/messages?since=" + lastId + who, { cache: "no-store" });
        if (!response.ok) throw new Error(String(response.status));

        const list = await response.json();
        for (const msg of list) {
          messages.append(renderMessage(msg));
          lastId = Math.max(lastId, msg.id);
        }
        if (list.length) messages.scrollTop = messages.scrollHeight;

        const online = await fetch("/online?name=" + encodeURIComponent(myName), { cache: "no-store" });
        if (!online.ok) throw new Error(String(online.status));
        const info = await online.json();
        setOnline(info.count);
      } catch {
        setConnected(false);
      }
    }

    poll();
    setInterval(poll, 1500);
  </script>
</body>
</html>
